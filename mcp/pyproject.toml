[project]
name = "kdenlive-mcp"
version = "0.1.0"
description = "MCP server driving a live Kdenlive (remote-control fork) over D-Bus"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp", "dbus-fast"]

[project.scripts]
kdenlive-mcp = "kdenlive_mcp.server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
